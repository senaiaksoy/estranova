name: Symptom assessment E2E

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: symptom-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Check symptom assessment mappings
        run: npx tsx scripts/check-symptom-assessment-mappings.mjs

      - name: Run browser E2E tests
        run: npm run test:e2e

      - name: Run production build gates
        run: npm run build:ci
