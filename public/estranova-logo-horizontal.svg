<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
  <title id="title">Estranova — Editoryal Saglik Platformu</title>
  <desc id="desc">Pembe daire monogrami solda, sagda Estranova wordmark ve Editoryal Saglik Platformu alt baslik.</desc>
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Kulim+Park:wght@400;500;600&family=Manrope:wght@200..800&family=Playfair+Display:wght@700;800;900&display=swap');
      .monogram {
        font-family: "Manrope", Arial, sans-serif;
        font-size: 120px;
        font-weight: 800;
        letter-spacing: -6px;
      }
      .wordmark {
        font-family: "Manrope", Arial, sans-serif;
        font-size: 72px;
        font-weight: 800;
        letter-spacing: -1px;
        fill: #DB2777;
      }
      .tagline {
        font-family: "Kulim Park", Arial, sans-serif;
        font-size: 19px;
        font-weight: 500;
        letter-spacing: 3.4px;
        fill: #DB2777;
      }
    ]]></style>
  </defs>

  <g transform="translate(0 10)">
    <circle cx="100" cy="100" r="82" fill="#DB2777"/>
    <text class="monogram" x="96" y="146" text-anchor="middle" fill="#FFFFFF">E</text>
    <circle cx="142" cy="58" r="7.5" fill="#FFFFFF"/>
  </g>

  <g transform="translate(220 0)">
    <text class="wordmark" x="0" y="120">ESTRANOVA</text>
    <text class="tagline" x="3" y="158">EDİTORYAL SAĞLIK</text>
    <text class="tagline" x="3" y="184">PLATFORMU</text>
  </g>
</svg>
