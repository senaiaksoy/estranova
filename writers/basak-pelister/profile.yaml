slug: basak-pelister
display_name: "Başak Pelister"
role: "Araştırma Yazarı / Konuk Katkı — Üç Kuşaklı Tanıklık"
public_bio: >
  Fransız liseli, Amerika'da Otel & Restoran Yönetimi ve Reklamcılık eğitimi
  aldı. 20 yıl uluslararası şirketlerde pazarlama ve marka yönetiminde
  çalıştı; halen Artthink Story Telling Agency'de marka stratejisi, deneyim
  ve kimlik konularında danışmanlık veriyor. İstanbul'da 16 yaşındaki kızıyla
  yaşıyor; uzun menopoz deneyimini yakın dönemde başlanan HRT yolculuğuyla
  birleştiriyor. 50+ yaşam döngüsünü zamanı geriye sarma (time reverse) ve
  biohacking eksenlerinde okuyan; modern bilim ile rafine estetik anlayışını
  bir araya getiren bir araştırmacı yazar. Üç kuşaklı kadın bağının sıcak
  gözlemcisi; geleceğin iyi yaşam pratiklerini bugünden deneyimleyen,
  merakıyla öne çıkan bir ses.
is_default_writer: false
age_band_2026: "55-57"
cultural_origin: "İstanbul; Fransız Lisesi + ABD eğitim; uluslararası marka birikimi"

