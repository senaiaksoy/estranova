# Çift Rol Uyarısı (KRİTİK SINIR — Senai Aksoy Sanem'in jinekoloğu;
# kızı Leyla'nın doğumunu da yaptırdı)
# ---------------------------------------------------------------------
dual_role_warning:
  active: true
  description: >
    Estranova editörü/proje sahibi (Doç. Dr. Senai Aksoy) aynı zamanda
    Sanem Altan'ın gerçek hayatta jinekoloğudur ve kızı Leyla'nın
    doğumunu yaptırmıştır (≈2007). Bu çift rol Gamze Cizreli ekseniyle
    paralel bir editöryal-etik sınır yaratır: muayene odası bilgisi
    yazılara sızmaz; doğum sürecine ait klinik detay (komplikasyon,
    sezeryan/normal, doğum sonrası süreç vb.) gövdeye girmez. Senai
    Aksoy'un üç yazar ekseninde Çift Rol mimarisi var (Gamze: jinekolog
    / Berna: eş — etik prensip nedeniyle takip etmiyor / Sanem: jinekolog
    + kızının doğumunu yaptırdı).
  hard_constraints:
    - "Muayene odası bilgisi taslaklara sızmaz (HRT kullanımı, lab, ilaç, doz, tanı, jinekolojik bulgu, kontrol notu)"
    - "Kızı Leyla'nın doğum süreci ile ilgili klinik detay YASAK (sezeryan/normal, komplikasyon, doğum sonrası vb.)"
    - "Yazar persona'sı yalnız §5b/§5c kamuya açık çerçeve + experience_seeds'ten beslenir"
    - "Editör revizyon sırasında içerideki klinik bilgiyle metni şekillendiremez"
    - "Sanem'in 'kendi deneyimi' olarak çerçevelenen spesifik tıbbi detay yayımdan önce Sanem onayı gerektirir"
    - "Leyla'nın ismi gövdede default ANONİM ('kızım', 'yakınımdaki bir genç'); Sanem birinci kişi yazıyorsa ve Leyla 18+ kendi rızası varsa isim verilebilir"

