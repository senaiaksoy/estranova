dual_role_warning:
  active: true
  description: >
    Editöryal ekipte yazar hakkında kamusal olmayan yaşam bilgileri bulunur.
    Bunlar public repo dosyalarına yazılmaz ve otomatik yüklenmez. Yalnız
    açıkça seçilmiş tek bir seed kimliğiyle, yazar incelemesine gidecek iç
    taslakta kullanılabilir.
  hard_constraints:
    - "Özel seed yalnız açık seed kimliğiyle ve tek kayıt olarak yüklenir; tam banka otomatik prompt girdisi değildir"
    - "Editör kaynaklı özel lead doğrulanmış gerçek sayılmaz ve yalnız yazar inceleme taslağında kullanılabilir"
    - "Kurgusal veya kompozit birinci tekil sahne Sanem'in açık kararı olmadan yayımlanamaz"
    - "Üçüncü kişiyi tanımlayan ayrıntı onun rızası olmadan çıkarılır veya genelleştirilir"
    - "Özel seed'lerdeki temalar birlikte özetlenerek kamusal personada yeniden tanımlanamaz"

