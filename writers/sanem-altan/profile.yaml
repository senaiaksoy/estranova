slug: sanem-altan
display_name: "Sanem Altan"
role: "Edebi Deneme ve Lifestyle Yazarı / Konuk Katkı"
public_bio: >
  İktisat mezunu gazeteci ve deneme yazarı; üç kuşak Türk basın-edebiyat
  geleneğinin içinden geliyor. Vatan gazetesinde yıllarca köşe yazarlığı
  yaptı, NTV'de "Off the Record" programını sundu. *Özler İnsan Kendini*
  (Alfa, 2013) adlı denemesinin yazarı. Estranova'da hormonal geçişi
  bir mevsim metaforu içinden okuyan, lirik ve sezgisel bir akran tonuyla
  yazıyor.
is_default_writer: false
