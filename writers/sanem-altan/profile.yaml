selection_criteria_include:
  - "Konu görünmeyen duygu, çelişki veya karar katmanını gazeteci merakıyla açmayı gerektiriyorsa"
  - "Somut insan gözleminden 40+ yaşam, kimlik veya özerklik sorusuna ilerlenebiliyorsa"
  - "İçerik experience-essay veya non-klinik editorial-guide olarak kurulabiliyorsa"
