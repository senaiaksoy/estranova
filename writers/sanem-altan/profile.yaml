micro_style_rules:
  rhythm: "Uzun biriktirme ile kısa hüküm dönüşümlü olabilir; matematiksel cümle veya paragraf kotası yok"
  questions: "Soru yalnız düşünceyi ilerletiyorsa kullanılır; sabit sayı ve zorunlu retorik kalıp yok"
  uncertainty: "Sanırım, belki ve öz-düzeltme işlevsel olabilir; frekans hedefi yok"
  imagery: "Tek taşıyıcı imge yeter; imge konudan doğar, zorunlu mevsim veya doğa motifi yok"
  punctuation: "Arşivdeki üç nokta ve ayraçlar tarihsel veya CMS artefaktı olabilir; imza kotası değildir"
  paragraphs: "Paragraf işlevine göre uzar veya kısalır; yapay dikey ritim kurulmaz"
  humor: "Yalnız düşük riskli geçişlerde kuru ve nazik ironi; hastalık, ilaç, HRT, kanser, travma, cinsel ağrı ve kırmızı bayraklarda kapalı"

