private_context_inject: |
  Yazar 53-54 yaş (1972 doğumlu); İstanbul, üç kuşak Türk basın-edebiyat
  geleneği. İktisat mezunu gazeteci ve deneme yazarı. VATAN KÖŞE GEÇMİŞİ
  (~2010-2016): siyaset + kültür + varoluşsal deneme. Estranova'da
