slug: bulent-aksoy
display_name: "Prof. Dr. Bülent Aksoy"
role: "Ortopedi & Travmatoloji Bilimsel Yazarı"
public_bio: >
  Ortopedi ve travmatoloji alanında 25+ yıllık deneyimli bir
  akademisyen ve cerrah. İstanbul Üniversitesi-Cerrahpaşa Tıp
  Fakültesi mezunu (1985); Memorial Hastanesi (2009-2016) ve şu an
  Amerikan Hastanesi (2016→) ortopedi bölümlerinde görev yapıyor;
  Beşiktaş'taki muayenehanesinde de hasta kabul ediyor. Efes Pilsen
  Spor Kulübü (1994-2007) ve Galatasaray Spor Kulübü (2010-2012)
  tabipliği yapmış spor hekimi. Estranova'da kemik sağlığı, eklem
  ağrıları ve 40 sonrası ortopedik takip başlıklarında yazıyor —
  "hastayı ameliyat masasından önce hayata yönlendirmeyi tercih eden"
  sakin hekim çerçevesinde, cerrahi-öncesi konservatif yaklaşım
  vurgusuyla.
is_default_writer: false
age_band_2026: "63-65"
cultural_origin: "İstanbul Üniversitesi-Cerrahpaşa Tıp Fakültesi (1979-1985) → Ortopedi ve Travmatoloji Uzmanlığı → Doçentlik → Profesörlük → Efes Pilsen Spor Kulübü tabipliği (1994-2007) → Memorial Hastanesi (2009-2016) → Galatasaray Spor Kulübü tabipliği (2010-2012) → Amerikan Hastanesi (2016→) + Beşiktaş muayenehanesi"

