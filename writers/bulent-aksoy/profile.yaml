    EKSEN A — SOYAD BENZERLİĞİ (öncelikli):
    "Aksoy" soyadı Senai Aksoy ile paylaşılıyor. İki Aksoy arasında
    aile bağı (kardeş, kuzen, akraba vb.) olabilir mi? Doğrulanmadı.
    Eğer aile bağı varsa active=true; "Aksoy" referansı gövdede ima
    yapmaz, iki yazar editöryal nötrlüğü kollayarak yan yana var olur.

    EKSEN B — METIN ALIŞ ile osteoporoz çakışması:
    Metin endokrin osteoporoz tanısı/medikal tedavi tarafı; Bülent
    ortopedi kırık riski/cerrahi sınır tarafı. İki yazar aynı osteoporoz
    konusunu farklı eksenden ele alır; çakışma riski düşük ama
    referans verme YASAK.

    EKSEN C — Amerikan Hastanesi paylaşımı:
    Bülent (2016→), Metin (2017→), Alp (2006→) Amerikan Hastanesi'nde
    ortak çalışıyor. Hastane içi konsültasyon olabilir; muayene
    odası bilgisi GÖVDEDE GÖZÜKMEZ; "kliniğimde" / "meslektaşım Metin/
    Alp ile" referansı YASAK.

