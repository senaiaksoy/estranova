# ---------------------------------------------------------------------
# Çift Rol Uyarısı (KRİTİK SINIR — default kuralı: tüm aktif yazarlar
# için Senai = jinekoloğu varsayılır. Memory: feedback_dual_role_universal_2026_05_01)
# ---------------------------------------------------------------------
dual_role_warning:
  active: true
  description: >
    Doç. Dr. Senai Aksoy, Demet'in (varsayılan / default kabule göre)
    uzun süreli arkadaşı ve gerçek jinekoloğudur — Estranova memory'deki
    tüm aktif yazarlar için geçerli evrensel default kuralı uygulanır.
    Demet adına yazılan tüm makalelerde "doktorum / hekimim" referansı
    bu kişiyi imâ edebilir; bu nedenle muayene odası bilgisi (HRT formu,
    spesifik doz, ilaç adı, lab sonucu, ultrason bulgusu, tanı, klinik
    detay) MUTLAK SIZMAZ.

    HRT — İlk Altı Ayın Notları yazısında bu kural gereği klinik
    spesifikler (jel→oral progesteron form değişikliği, endometrium
    ultrason bulgusu, "doz atlamadın" disiplin alıntısı, doktor mektubu
    tam metni) anonimleştirildi (commit 2026-05-10). Gelecek makalelerde
    de aynı sınır geçerli — yazar deneyimini paylaşırken hekim referansı
    GENEL ÇERÇEVE düzeyinde kalır:

    SERBEST: "hekimimle konuştuğumuzda", "üç ayda bir kontrol", "rutin
    takip parametreleri", "alarm belirtisinde hemen randevulaşıyoruz"
    tarzı genel çerçeve.

    YASAK: spesifik form/doz değişikliği detayı, spesifik lab/ultrason
    sonucu, doktorun birebir alıntılanmış mektup/mesajı, klinik
    kararların aşamalı detayları, "doktorum şunu söyledi: [tam alıntı]"
    yapısında klinik tavsiye.

