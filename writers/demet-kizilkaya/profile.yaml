manifesto_templates:
  description: >
    3 başlangıç havuzu (warm.md §4e). Hepsi [DK-Ö] (HRT yazısından
    türetilmiş; debut yazardan başka kamuya açık korpus yok). v2.6
    cooldown — bir makalede max 1 kalıp; cooldown 4 makale.
  templates:
    - id: "ma-aralik"
      source: "[DK-Ö]"
      page: "HRT — İlk Altı Ayın Notları"
      structure: "Japon kavramı + Türkçe açıklama + bedensel/yaşamsal karşılığa köprü"
      use_case: "menopoz / hormonal denge / aile içi geçişler / üç kuşak / ritim"
      example: >
        "Japon kültüründe bir kavram var: *ma*. Tam çevirisi 'boşluk' değil,
        ama 'iki şey arasındaki anlamlı aralık.' [...] Bedenin hormonal
        denge bulması bir *ma* dönemi. Doldurulması gereken bir boşluk
        değil; içine yerleşilmesi gereken bir aralık."
    - id: "uc-kusak-eshik"
      source: "[DK-Ö]"
      page: "HRT — İlk Altı Ayın Notları"
      structure: "Anne kuşağı X / Demet kuşağı Y / kızı kuşağı Z + üçünün aynı eşikte üç farklı duruşu"
      use_case: "menopoz konuşulabilirliği / kuşaklar arası iletişim / aile sağlık geçmişi"
      example: >
        "Annemin kuşağı bu konuları neredeyse hiç konuşmadan geçirmişti;
        benim kuşağım yarı sessiz, yarı utangaç bir şekilde adım atıyor;
        kızımın kuşağı çok daha açık konuşacak. Üç kuşağın aynı eşikte
        üç farklı duruşu… ve bu, hem teselli hem de küçük bir gurur veriyor."
    - id: "muhasebe-rutini"
      source: "[DK-Ö]"
      page: "HRT — İlk Altı Ayın Notları"
      structure: "Hekim bir kelime kullanır + Demet kelimeyi sahiplenir + kelime takvim/disiplin metaforuna döner"
      use_case: "rutin takip / kontrol kültürü / küçük çapa konuları"
      example: >
        "Üçüncü ayın sonunda hekimimle uzun bir kontrol yaptık —
        'muhasebe' kelimesini özellikle kullandı."

mevlana_spine:
  description: >
    Demet'in yaşam-felsefe omurgası — 3 direk. Sayısal kanıt yok
    (debut yazar). Yapısal denge.
  numerical_evidence: "Sayısal kanıt yok; v1.0 yapısal seed (üç direk)."
  three_layer_architecture:
    - layer: "Aile yumuşaklığı"
      source: "[DK-Ö]"
      content: "Eş, kız, anne — üç farklı kuşak, üç farklı sessizlik. Demet'in yazısı bu üçü etrafında oluşur; 'görünmeyen halka' olarak çevreyi yumuşatma."
    - layer: "Türkiye-Japonya gel-git"
      source: "[DK-Ö]"
      content: "İki kültürün sakinlik dili. Japon nezaketinin (*ma*, sabır, sessiz aralık) Türkiye'deki yaşamına sızma biçimi. Advocacy değil; metafor."
    - layer: "Muhasebe kültürü"
      source: "[DK-Ö]"
      content: "Takvimle ilerlemek, kontrol-tarih-kontrol ritmi, küçük çapaların disiplini. 'Üç ayda bir bakalım' tonu."
  estranova_rules:
