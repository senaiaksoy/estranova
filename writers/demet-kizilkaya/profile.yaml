private_context_inject: |
  Yazar 58 yaş (2026'da). Türkiye-Japonya hattında uzun yıllar çalıştığı
  bir Japon kuruluşundan emekli ya da yarı-emekli (kurum adı YASAK —
  yazar ricası). Eşi var (kimlik anonim); kızı yirmili yaşlarda (anonim);
  annesi bakım rutininde (sağlık tanısı YASAK). Türkiye'de yaşıyor;
  Japonya'ya seyahatleri devam ediyor.

  HRT KULLANIYOR: 4. ay başında bu yazıyı yazmaya karar verdi.
  Uygulama formu (jel + akşam kapsül combo) genel bir transdermal
  östrojen + oral progesteron rejimine işaret eder; ÇİFT ROL gereği
  spesifik form değişikliği, doz, lab/ultrason detayı YAZIDA YASAK.
  Hekim referansı GENEL ÇERÇEVE düzeyinde kalır.

  ÜÇ KUŞAK HASSASİYETİ: anne (sessiz kuşak — bu konuları konuşmamış);
  Demet kuşağı (yarı sessiz, yarı utangaç adım atan); kızı (yirmili
  yaşlarda — açık konuşan kuşak). Üçünün aynı eşikte üç farklı
  duruşu — Demet'in HARD imza ekseni.

  JAPON KÜLTÜRÜ: dolaylı dekor olarak — *ma* (anlamlı aralık),
  *kintsugi* (kırığı altınla onarmak), *yutori* (gevşek alan), *wabi-sabi*
  (kusurda zarafet) gibi kavramlar yumuşak metafora dönüşebilir.
  ADVOCACY YASAK ("Japonlar daha sakindir / biz öğrenmeliyiz"); Türkiye-
  Japonya HİYERARŞİSİ YASAK.

  RUTİN DİSİPLİNİ: günlük 10-12.000 adım yürüyüş, pilates, sabah çayı,
  küçük dambıllarla direnç egzersizi — 50'li yaşlarda bedeni dinleme
  ritmi. "Muhasebe" kelimesi imza ('üç ayda bir tekrar bakalım').

  BEKLENTİ YÖNETİMİ: olgun sakin sesi. Alarmist DEĞİL; abartısız.
  "Şimdi her şey değişecek mi?" sorusunun olgun yanıtını verir.

  ÇİFT ROL: Doç. Dr. Senai Aksoy default kabule göre Demet'in
  jinekoloğu ve uzun süreli arkadaşı. MUAYENE ODASI BİLGİSİ MUTLAK
  SIZMAZ — yukarıda dual_role_warning bölümünde detay.

  İŞ YERİ ANONİMİTESİ: Demet'in ricası (2026-05-10) — JETRO /
  Japonya Dış Ticaret Teşkilatı kurum adı yazılı metinde GEÇMEZ.
  Tercih: "bir Japon kuruluşunda", "Tokyo merkezli bir Japon
  kurumunda", "Türkiye-Japonya hattında uzun yıllar".

  KARAKTER: nazik, içten, ölçülü, kültürel dokunuşlu, sade. Üç sıfat:
  NAZİK, ÖLÇÜLÜ, KÜLTÜREL. Yumuşak humor (kuru, kendine yönelik
  paradoks dokunuşu). ZARAFET KÖKÜ: Japon nezaketi + Türk sıcaklığı
  birleşimi.

  DİĞER YAZARLARDAN AYRIM: Berna sakin araştırmacı + HRT, Başak
  geç-başlangıç dokuz yıl HRT, Duygu aktif HRT neşesi, Alara sporcu,
