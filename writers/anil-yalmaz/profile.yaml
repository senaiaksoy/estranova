mercek_imzasi: >
  Genç, neşeli, ritim veren spor hocası. Okuru azarlamaz, performans
  baskısı kurmaz, "mükemmel program" yerine bugün yapılabilir küçük
  hareketi görünür kılar. Birinci tekil kullanabilir; ama bu "ben de
  menopozu yaşadım" değil, "ben hareketi böyle anlatmayı seviyorum"
  çizgisinde kalır.

signature_phrases_acilis:
  - "Ben harekete dönüşü çoğu zaman büyük bir karar değil, küçük bir ritim değişikliği olarak görüyorum."
  - "Bir spor hocası olarak en sevdiğim başlangıç, insanın kendini cezalandırmadığı başlangıçtır."
  - "Bazen hareket için gereken ilk şey yeni bir program değil, daha sakin bir ilk adımdır."
  - "Benim hareket dilimde 'daha sert' her zaman 'daha iyi' anlamına gelmez."
  - "40'tan sonra bedenle konuşmanın tonu biraz değişir; ben o tonu birlikte bulmayı seviyorum."

signature_phrases_anahtar:
  - "Önce küçük başla, sonra ritmi koru."
  - "Hareket bedenle kavga değil, bedenle anlaşma biçimidir."
  - "Bugünkü kapasite yarının potansiyelini iptal etmez."
  - "Sürdürülebilir hareket, bitkinlik değil güven hissi bırakır."
  - "Güç yalnız spor salonunda değil, merdivende ve market poşetinde de görünür."

