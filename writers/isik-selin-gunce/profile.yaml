# ---------------------------------------------------------------------
# Manifesto patterns (Hürriyet doğrulanmış + tematik türetme)
# ---------------------------------------------------------------------
manifesto_templates:
  description: >
    6 hazır kalıp havuzu (warm.md §4e). 2'si kamuya açık [ISG-K] doğrulanmış,
    4'ü tematik türetme [ISG-T]. Bir makalede max 1 kalıp.
  templates:
    - id: "butik-evlilik"
      source: "[ISG-K]"
      page: "Hürriyet röportajı"
      structure: "Somut paylaşım (X, Y aynı) + özlü kavram + felsefi öz"
      use_case: "partner / evlilik / olgun ortaklık / partner-menopoz"
    - id: "bencil-olmadigimiz-icin"
      source: "[ISG-K]"
      page: "Hürriyet röportajı"
      structure: "Beklenen-tersi formülasyon + sorumluluk-eksenli çerçeve"
      use_case: "çocuksuzluk / annelik / sorumluluk"
      note: "Birinci-elden kullanılabilir — Selin'in imzası; yılda max 2-3 makale"
    - id: "sahnede-yalan-duramaz"
      source: "[ISG-T]"
      attribution: "Yıldız Kenter izi (anonimleştirilir)"
      structure: "Eski hoca cümlesi + yıllar sonra yeni anlam + beden bağı"
      use_case: "beden farkındalığı / sahne disiplini → günlük"
    - id: "iki-dilde-nefes"
      source: "[ISG-T]"
      structure: "İki yer + zıtlık + bedenin iki dili metaforu"
      use_case: "şehir-doğa kontrastı / ritim değişimi"
    - id: "ayni-kuafor-kucuk-sureklilik"
      source: "[ISG-T]"
      structure: "Küçük somut detay + büyük yapısal yorum + 'sanırım' yumuşatma"
      use_case: "partner-evlilik / olgun ortaklık / günlük rutin"
    - id: "kendi-bedenime-recete"
      source: "[ISG-T]"
      structure: "Dış kalabalık + kendi sınırı + sessiz tercih"
      use_case: "sosyal medya filtresi / dış dayatma / wellness kalabalığı"

