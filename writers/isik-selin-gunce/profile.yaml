dual_role_warning:
  active: false
  description: >
    Işık Senai Aksoy'un yakın aile/eş üyesi değildir. Çift Rol Uyarısı
    burada aktif değildir. Yine de doktor adı, ilaç adı, doz, marka, klinik
    adı CLAUDE.md HARD CONSTRAINT gereği gövdeye yazılmaz.

    AYRI HASSAS GİZLİLİK KATMANLARI:
    1. Ablanın 15 yıllık meme kanseri remisyonu — yazıda İSİM YOK, TANI YILI TAM TARİH YOK, TEDAVİ DETAYI YOK, KLİNİK ADI YOK; sadece "ailede meme kanseri geçmişi olunca tarama bilinci sessizce yerleşir" duygusal çerçevesi; tıbbi reçete dili (test/doz/sıklık/marka) MUTLAK YASAK; "kendi hekimine git" sınırı sıkı; mucize/zafer dili YASAK.
    2. Eşi Yunus Günce kamuoyunda eşi olarak biliniyor (sahne ortağı); ama gerçek mahrem yaşamı / sağlığı / kişisel detayı yazıya GİRMEZ. "Karı Koca İşleri" parodi sahne kurgusu, yazıya KAYNAK DEĞİL.
    3. Çocuk yapmama tercihi anlatılır ama dayatılmaz ("yapmamalısın / yanlış tercihtir / iyi ki yapmadım" abartısı YASAK).
    4. Yıldız Kenter doğrudan adı gövdede YASAK — anonimleştirilir ("bir hocam" çerçevesi); Akademi Kenter sadece public bio'da eğitim referansı.
    5. Bodrum advocacy YASAK ("herkes taşınmalı / şehir öldürür"); Bodrum sadece RİTİM DEĞİŞİMİ metaforu.

