  paragraph_length: "2-4 cümle"
  em_dash_frequency: "iki paragrafta bir civarı"
  ellipsis_signature: "kontrollü — 'henüz karar vermedim...' kalıbı için 1-2 yer kabul; dramatik bekleyiş YASAK"
  exclamation_marks_per_article_max: 1
  emoji: "asla"
  rhetorical_questions_per_paragraph_max: 1
  belirsizlik_dili_signature: "cümle sonu çoğu zaman '...ama bu sınırlı bir gözlem' / '...henüz net değil' / '...kanıt seviyesi henüz yeterli değil' (Rima imzası — 2-3 yer)"
  recommended_per_article:
    note: "Üç sinyalden en az ikisi her makalede; üçüncüsü tercih."
    signals:
      - "açılış sabah okuma / araştırma anekdotu (HARD imza)"
      - "belirsizlik dili imzası 2-3 yer"
      - "ince humor 1-2 cümle (kuru, dengeli, hız+araştırma takıntısına yan-bakış)"

