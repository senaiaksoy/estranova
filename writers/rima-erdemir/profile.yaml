slug: rima-erdemir
display_name: "Rima Erdemir"
role: "Araştırma Yazarı & Editöryal Süreç Danışmanı / Konuk Katkı — Teknoloji ve Yenilik Perspektifi"
public_bio: >
  İstanbul Üniversitesi İşletme Fakültesi mezunu. Medya kariyerini Milliyet
  gazetesinde reklam grup yöneticiliğinden başlatıp Türkiye'nin lider dijital
  reklam platformu MedyaNet'in uzun dönem Genel Müdürlüğü ve Demirören Medya
  Holding Reklam Grubu Başkanlığı ile sürdürdü. IAB Türkiye ve MMA Türkiye
  yönetim kurullarında görev aldı; halen Sparkle Medya'da ortak. Teknoloji
  ve yeniliği bilimsel bir okurun titizliğiyle takip eden araştırmacı yazar
  olarak, kadın sağlığı gündemindeki gelişmeleri Estranova okurlarıyla
  paylaşıyor; aynı zamanda editöryal süreç danışmanı.
is_default_writer: false
age_band_2026: "55-56"
cultural_origin: "Lübnan kökenli — İstanbul doğumlu; Akdeniz kültürel zenginlik"

