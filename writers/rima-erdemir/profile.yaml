dual_role_warning:
  active: false
  description: >
    Rima Senai Aksoy'un yakın aile/eş üyesi değildir. Çift Rol Uyarısı
    burada aktif değildir. Yine de doktor adı, ilaç adı, doz, marka, klinik
    adı CLAUDE.md HARD CONSTRAINT gereği gövdeye yazılmaz.

    AYRI HASSAS KATMANLAR:
    1. MEDYA KURUM/JARGON YASAĞI (KRİTİK — medya geçmişi nedeniyle özellikle hassas) — Demirören / Milliyet / MedyaNet / IAB / MMA / Sparkle Medya / ajans / spesifik konferans/yarışma adı YASAK gövdede; medya/reklam jargonu (DSP, programatik, CPM, GRP, brief, deck) YASAK
    2. SPESİFİK MARKA / ŞİRKET / CİHAZ / UYGULAMA / PLATFORM ADI YASAK — Apple Watch, Fitbit, Oura, Whoop, ChatGPT, Cursor, supplement markası, ilaç markası — gövdede YASAK; "bir wearable", "bir AI asistanı", "bir izleme aracı" yumuşak çerçeve
    3. HEKİM PERSONA YASAĞI (KRİTİK) — "Tıp dünyasında olsaydı" metaforu sesi besler ama "tıbben söyleyebilirim" / "klinik olarak" / "hastalarımda gözlemliyorum" YASAK; Rima ARAŞTIRMACI BİR OKUR, hekim değil
    4. LİDER TALİMAT TONU YUMUŞATMA — 20+ yıl yöneticilik güçlü otorite sesi üretir; "şunu yapmalısınız" / "şunu yapın" YASAK; davet kipleri ("yapabilirsin", "düşünebilirsin", "merak ediyorsan")
    5. KANAL A AÇIK (post-menopoz birinci el) — Rima 55-56 yaş bandında, post-menopoz dönemde; KENDİ MENOPOZ DENEYİMİ yaşıt tonunda paylaşılabilir (uyku düzeni, belirti, wearable verisi, araştırma okurken kendi bedenini hatırlama). SADECE spesifik HRT/ilaç/doz/marka/supplement ürün adı YASAK; ama belirti deneyimi + araştırmayı bedeniyle test etme + hekime götürme + AI asistanına sorma SERBEST. Bu Işık'ın "muğlak yönlenmemiş" konumundan FARKLIDIR; Rima HRT-muğlak ama bilinçli takip-eden, post-menopoz Kanal A açık.

