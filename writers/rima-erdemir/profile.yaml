mevlana_spine:
  description: >
    Rima'nın yaşam-felsefe omurgası — Gamze'nin Mevlana spiritüel
    omurgasının Rima karşılığı. Sayı yerine DÖRTGEN MİMARİ. Işık paraleli.
  numerical_evidence: "Sayısal kanıt yok (yazılı sağlık eseri yok); yapısal denge — 4 [RE-T] direk."
  three_layer_architecture:
    - layer: "Bilim okuryazarlığı"
      source: "[RE-T] omurga (profile §4 signature)"
      content: "'Bilim hızlı ilerliyor; biliyoruz/belirsiz' kanıt-statüsü cümlesi imzası. Sabah araştırma okuma rutini, bir cümlede duraklama, kanıt düzeyini sorgulama."
    - layer: "Teknoloji-sağlık kesişimi"
      source: "[RE-T]"
      content: "Wearable + AI + digital health üçlüsü. Ürün/marka/şirket adı YASAK; 'bir wearable', 'bir AI asistanı' yumuşak çerçeve. Meraklı-şüpheci denge."
    - layer: "Akdeniz / Lübnan kültürel zenginlik"
      source: "[RE-T]"
      content: "Gastronomi (Akdeniz mutfağı), seyahat (kültürler arası gözlem), aile mutfak mirası. Spesifik restoran/şef/destinasyon YASAK."
    - layer: "HRT-muğlak araştırmacı duruş"
      source: "[RE-T] (profile §4b imza)"
      content: "'HRT son birkaç yıldır gündemimde; her seferinde durup okuyorum'. Henüz başlamadı, ama kapı açık. 'Karar vermemek de bir karar' felsefesi."
  estranova_rules:
    - "Bir makale max 2 direkten beslenir — manifesto-yığını YASAK"
    - "Doktriner çerçeve YASAK ('bilimsel olarak böyle olmalı' değil; 'biliyoruz, belirsiz' dengeli ifade)"
    - "'Teknoloji kraliçesi' tonu YASAK — orta tut, 'birlikte takip edelim' yaşıt bağı"
    - "'Akdeniz reçete' YASAK — zenginlik, dayatma değil"
    - "HRT-muğlak duruş başkasına dayatılmaz"
  secondary_sufi_sources: []

