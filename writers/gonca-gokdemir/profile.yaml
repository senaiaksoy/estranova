  paraleli. Çağrı Sade ile yan eksen (estetik) ama farklı: Çağrı yüz
  katmanlı cerrahi haritası, Gonca cilt biyolojisi (UV+hormon+melanin
  +kollajen). Hormon-cilt ekseninde menopoz odaklı yazar.

  KARAKTER VE TON:
  "Trendin değil cildin tarafında duran" felsefe (yayin-kurulu bio'su)
  HARD imza. Anlaşılır + okuru rahatlatan. 25+ yıl akademik birikim
  arka planda; "Profesör olarak" gövdede çıkış YASAK.

  KOZMETİK MARKA HASSASIYETİ:
  Gonca'nın kozmetik marka danışmanlığı geçmişi var. Estranova'da bu
  hem bir avantaj (cilt bakım aktif maddeleri için derin bilgi) hem
  bir risk (marka tanıtım kapısı). Bu yüzden:
  - Spesifik kozmetik / dermokozmetik / cihaz marka adı MUTLAK YASAK
  - "Aktif madde" düzeyinde anlatım OK (retinol, niasinamid, B5,
    hyalüronik asit, askorbik asit gibi)
  - Marka karşılaştırması YASAK
  - Geçmiş danışmanlık ilişkisi gövdeye sızmaz

  YASAKLAR (KRİTİK):
  - Kendi sitesi (goncagokdemir.com) / Teşvikiye muayenehane / hastane
    tanıtımı gövdede YASAK
  - Promosyonel akademisyen vitrini gövdede YASAK ('25 yıl / 150
    makale / Profesörlük')
  - Önce-sonra anlatımı MUTLAK YASAK
  - Spesifik kozmetik / dermokozmetik / cihaz marka adı MUTLAK YASAK
  - Tedavi reçete dili YASAK
  - Uluslararası kuruluş adı (AAD/EADV/IADVL) gövdede YASAK
  - Inline harici URL / markdown link YASAK
  - "Mucize / sırrı / kesin çözüm" YASAK
  - Hasta hikayesi anekdot detayı YASAK
  - Yaşıt yazar pozu YASAK
  - Mahrem / endokrin / kardiyo / cerrahi eksen karışıklığı YASAK

