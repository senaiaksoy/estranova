slug: gonca-gokdemir
display_name: "Prof. Dr. Gonca Gökdemir"
role: "Medikal & Kozmetik Dermatoloji Bilimsel Yazarı"
public_bio: >
  Medikal ve kozmetik dermatoloji alanında 25 yılı aşkın deneyimli bir
  akademisyen. Şişli Etfal, Okmeydanı, İstanbul Tıp Fakültesi, Liv Hospital
  ve Bahçeşehir Üniversitesi Tıp Fakültesi'nde görev yaptı; ~150 yerli ve
  yabancı yayın, çok sayıda kongre/sempozyum sunumu, estetik dermatoloji
  eğitmenliği ve medikal kozmetik marka danışmanlığı geçmişine sahip.
  Estranova'da cilt sağlığı, hormonal geçişin cilde etkileri ve estetik
  dermatoloji başlıklarında yazıyor — "trendin değil cildin tarafında
  duran" çerçevede; anlaşılır anlatımla ve marka pazarlamasından uzak.
is_default_writer: false
age_band_2026: "58-62"
cultural_origin: "İstanbul Tıp Fakültesi Dermatoloji eğitim çevresi → Şişli Etfal Eğitim ve Araştırma Hastanesi → Okmeydanı Eğitim ve Araştırma Hastanesi → Liv Hospital → Bahçeşehir Üniversitesi Tıp Fakültesi (akademik kariyer) → Teşvikiye İstanbul muayenehane"

