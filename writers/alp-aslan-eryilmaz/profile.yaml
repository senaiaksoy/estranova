public_bio: >
  Girişimsel kardiyoloji alanında 25+ yıllık deneyimli bir hekim. Akdeniz
  Üniversitesi Tıp Fakültesi mezunu, İstanbul Üniversitesi Çapa
  Tıp Fakültesi'nde kardiyoloji uzmanlığı; Türkiye'nin ilk TAVİ (2009) ve
  ilk MitraClip (2010) ekiplerinde yer aldı. 2006'dan beri Amerikan
  Hastanesi'nde. Estranova'da kardiyovasküler risk, menopoz sonrası kalp
  sağlığı ve önleyici kardiyoloji başlıklarını sade Türkçeyle açıyor —
  panik dili değil "erken tarama hayat kurtarır" repertuvarı.
