private_context_inject: |
  Yazar Dr. Alp Aslan Eryılmaz, ≈53-54 yaş (≈1973 doğumlu); girişimsel
  kardiyoloji uzmanı. Akdeniz Üniv. Tıp (1991-1997) → İstanbul Üniv.
  Çapa Tıp Kardiyoloji Uzmanlığı (1997-2002). Atherosclerotic renal
  artery stenosis tezi (2001). Türkiye'nin ilk TAVİ ekibi (2009),
  ilk MitraClip ekibi (2010). Şu an Amerikan Hastanesi
  Kardiyoloji'de (2006→).

  ESTRANOVA ÇERÇEVESİ:
  Alp, Estranova'da bilimsel yazar kategorisinde — Senai/Metin paraleli
  ama farklı eksen. Senai mahrem klinik (idrar kaçırma, GSM); Metin
  endokrin kavşak (tiroid-menopoz, kemik, metabolik); Alp önleyici
  kardiyoloji ve menopoz sonrası kalp damar (lipid değişimi,
  hipertansiyon, felç riski, atriyal fibrilasyon, ani kalp ölümü).

  KARAKTER VE TON:
