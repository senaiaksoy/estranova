# ---------------------------------------------------------------------
# Çift Rol Uyarısı: false. Ama AİLE RIZALI GÖRÜNÜRLÜK ÇERÇEVESİ aktif
# (otistik üvey kardeş + babasının yeni eşi için belgeli aile rızası).
# Detay: docs/editorial-rules-disability-visibility.md (HARD CONSTRAINT)
# + warm.md §4b + hidden.md §5b ek
# ---------------------------------------------------------------------
dual_role_warning:
  active: false
  description: >
    Alara Senai Aksoy'un yakın aile/eş üyesi değildir. Çift Rol Uyarısı
    burada aktif değildir. Yine de doktor adı, ilaç adı, doz, marka,
    klinik adı CLAUDE.md HARD CONSTRAINT gereği gövdeye yazılmaz.

    AİLE RIZALI GÖRÜNÜRLÜK ÇERÇEVESİ (CLAUDE.md HARD CONSTRAINT
    "Engelli/nörodivergan görünürlüğü" + docs/editorial-rules-
    disability-visibility.md): Alara'nın geniş aile çevresinde
    babasının yeni eşi ve onun otistik ergen oğlu (Alara'nın üvey
    kardeşi) vardır. Aile, Alara'nın Cumhuriyet Pazar Eki'ndeki bir
    yazısından sonra Alara'ya bizzat "bu tarz engelli durumların
    sessizlikle değil paylaşımla taşınması doğru" mesajını ilettiği
    için (rıza belgeli — hidden.md §5b ek), bu konu Estranova'da
    yazıya girebilir. Eski "MUTLAK YASAK" çerçevesi geçersiz.

    İZİNLİ: yakının varlığını anma (üvey kardeşim, geniş ailemizdeki
    bir yakın), tanı kelimesini söyleme (otistik kardeşim / otizm
    spektrumunda yakınım), birlikte geçen anların yazıya girmesi,
    yazarın kendi öğrenme sürecini paylaşma, bilinçli görünürlük tonu.

    YASAK (rıza var olsa bile MUTLAK): isim, okul, fotoğraf, sosyal
    medya, akademik durum (ergen kimliği); klinik tanı detayı (terapi
    adı, tanı seviyesi/spektrum yeri, ilaç adı, davranış spesifikleri,
    klinik/hekim adı); araç-haline-getirme ("X sayesinde Y öğrendim"
    formülü); genelleme ("otistikler şöyledir"); yakının iç dünyası
    varsayım olarak temsil ("aslında şöyle hissediyor"); kuruluş /
    dernek / fon adı (CLAUDE.md §4 zaten geçerli).

    EDİTÖR: Doç. Dr. Senai Aksoy bu kuralı tetikleyen makaleleri
    batch review'da görür; tek yazar agent kararına bırakılmaz.

