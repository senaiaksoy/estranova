# DUYGU KARAOSMANOĞLU İLE YAN EKSEN — yapısal Çift Rol
dual_role_warning:
  active: true
  description: >
    KRİTİK YAPI. Elif ve Duygu Creadenta'nın iki kurucu ortağı (2001→).
    Aynı uzmanlık (porselen laminalar / estetik diş hekimliği), aynı
    Siena Üniversitesi Master'ı, ortak EDAD üyeliği, ortak
    uluslararası yayınlar. Estranova'da iki ayrı yazar olarak
    konumlanırlar:

    - **Elif:** Akademik-lider kanat (EDAD Genel Sekreter, DEKİD
      Başkan Yardımcısı, eğitim veren akademisyen-klinisyen). Eksen:
      teknik derinlik + akademik birikim + minimal invaziv felsefe.
    - **Duygu:** Klinik-yaşıt kanat (lifestyle yazımına yakın
      başladı, sonra bilimsel yazara geçti). Eksen: HRT deneyimi +
      gündelik klinik gözlem + Londra-İstanbul yaşam tarzı (eski
      lifestyle profil mirası).

    Aynı klinikten paylaşılan vakalar GÖVDEDE GÖZÜKMEZ.
    "Kliniğimizde" tipi referans YASAK. İki yazar editöryal
    nötrlüğü kollayarak yan yana var olur. Creadenta marka adı
    biyografide; gövdede YASAK.

