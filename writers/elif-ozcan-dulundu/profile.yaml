public_bio: >
  Estetik diş hekimliği ve porselen laminalar alanında 30+ yıllık
  deneyimli bir diş hekimi. İstanbul Üniversitesi Diş Hekimliği
  Fakültesi (1991) mezunu, Siena Üniversitesi (İtalya) Protetik,
  Estetik ve Dijital Diş Hekimliği Master'ı. Creadenta'nın kurucu
  ortağı; EDAD (Estetik Diş Hekimliği Akademisi Derneği) Genel
  Sekreteri ve DEKİD (Diş Hekimleri Klinik Sahipleri Derneği) Başkan
  Yardımcısı. 2003'ten beri meslektaşlarına eğitim veriyor; uluslararası
  dergilerde porselen laminalar üzerine yayınları var. Estranova'da
  gülüş tasarımı, diş sağlığı ve hormonal geçişin ağız sağlığına
  etkileri başlıklarında "sade ama kalıcı olanı seven" çerçevede yazıyor.
