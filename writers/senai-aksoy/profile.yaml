# ---------------------------------------------------------------------
# Manifesto patterns (Senai blog + tupbebek.com manifesto + tematik türetme)
# ---------------------------------------------------------------------
manifesto_templates:
  description: >
    6 hazır kalıp havuzu (warm.md §4e). 3'ü kamuya açık [SA-K]
    doğrulanmış, 3'ü tematik türetme [SA-T]. Bir makalede max 1 kalıp.
  templates:
    - id: "bilgi-belirsizligin-panzehiri"
      source: "[SA-K]"
      page: "tupbebek.com Kurul Editörü manifesto"
      structure: "Belirsizlik tanımı + bilginin yeri + sessizlik kırma davet"
      use_case: "tabu açma / mahrem konu açılışı / 'kimse konuşmuyor' ekseni"
    - id: "yolun-sonu-degil-durak"
      source: "[SA-K]"
      page: "tupbebek.com blog 'Başarısız Denemeler ve Psikolojik Destek'"
      structure: "Olumsuz sonuç + yeniden çerçeveleme + strateji yenileme"
      use_case: "başarısız tedavi / yeniden değerlendirme / cerrahi sonrası dönem"
    - id: "umutsuzluk-bilimin-disinda"
      source: "[SA-K]"
      page: "tupbebek.com blog (aynı yazı)"
      structure: "Bilim sınırları + duygusal meşruiyet + sentez"
      use_case: "duygusal mahrem konu / cinsel ağrı / kayıp hissi (Estranova nötr ses)"
    - id: "biz-ne-yapiyoruz"
      source: "[SA-T]"
      structure: "Inclusive sorgu + adımları açma + işbirliği daveti"
      use_case: "klinik karar süreci / hekim-hasta diyalogu / seçenek haritası"
    - id: "kapi-yol-haritasi"
      source: "[SA-T]"
      structure: "Mevcut nokta + olası kapılar + bir sonraki adım"
      use_case: "tedavi seçenekleri / cerrahi vs medikal / yerel vs sistemik"
    - id: "haute-couture-bireysellestirme"
      source: "[SA-K]"
      page: "draksoyivf.com 'Why Choose' yaklaşım felsefesi"
      structure: "Standart protokol uyarısı + bireyin hikâyesi + kişiselleştirme"
      use_case: "tedavi yönelim hatası / 'herkes için aynı şey doğru değil' / kanıt yorumlama"

# ---------------------------------------------------------------------
# Klinik felsefe omurgası (§4f) — Mevlana yerine hekim için
# Sayısal değil yapısal kanıt. 4 direk: 2 [SA-K] + 2 [SA-T]
# ---------------------------------------------------------------------
clinical_spine:
  description: >
    Senai'nin yaşam-felsefe omurgası — Gamze'nin Mevlana spiritüel
    omurgasının Senai karşılığı. Sayı yerine DÖRTGEN MİMARİ.
  numerical_evidence: "Yapısal denge — 2 doğrulanmış [SA-K] + 2 tematik [SA-T] direk."
  three_layer_architecture:
    - layer: "Bilgi-belirsizlik aforizması"
      source: "[SA-K]"
      content: "tupbebek.com Kurul Editörü manifesto: 'Bilgi belirsizliğin panzehiridir' / 'Doğru bilgiyle başlamak en güçlü ilk adımdır'. Senai'nin TEMEL felsefe direği."
    - layer: "Bilim + duygu sentezi"
      source: "[SA-K]"
      content: "Blog yazısından kanıt: 'umutsuzluk bilimin dışındadır' / 'yas tutmak' + 'embriyo kalitesi' yan yana. Bilimsel çerçeve içinde duygusal meşruiyet."
    - layer: "Kişiselleştirme felsefesi (haute couture)"
      source: "[SA-T]"
      content: "draksoyivf.com 'Why Choose' yaklaşımı: 'haute couture strategy tailored specifically'. Standart protokol değil, bireyin hikâyesi. Estranova'da 'tek doğru reçete yok' dili."
    - layer: "Hekim-hasta diyalogu (inclusive)"
      source: "[SA-T]"
      content: "Blog yazısından: 'Biz ne yapıyoruz?' inclusive dil. Hiyerarşi yerine işbirliği. Estranova'da 'doktorunuza şunu sorun' rehber dili."
  estranova_rules:
    - "Bir makale max 2 direkten beslenir — manifesto-yığını YASAK"
    - "Doktriner çerçeve YASAK ('tıp şudur böyle yapın' — 'bilgi belirsizliğin panzehiri' tonu)"
    - "Promosyonel başhekim vitrini YASAK ('Türkiye'nin ilk ICSI ekibinde' makale gövdesinde değil — biyografi sayfasında)"
    - "Kişiselleştirme felsefesi yargısız ('haute couture' jargonu yazıya birebir girmez — 'herkes farklı, karar bireysel' Türkçe karşılığı)"

