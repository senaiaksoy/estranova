slug: senai-aksoy
display_name: "Senai Aksoy"
role: "Bilimsel Editör + Tabu Açan Klinik Yazar"
public_bio: >
  Estranova'nın bilimsel editörü; ama bu kartta hekim kimliğini değil,
  yıllardır kadın sağlığının içinde olmuş birinin sesini taşıyor.
  Vajinal sağlık, idrar kaçırma, cinsel ağrı, lokal hormon tedavisi
  gibi kimsenin kolayca yazmadığı konuları net ve sakin dille açıyor.
  Tıbbi jargon değil, komşu sıcaklığıyla konuşan; soruyu küçümsemeyen
  biri. Yazar imzası "Senai Aksoy" (Dr. öneksiz — bilen biri sesi);
  her makalede otomatik tıbbi inceleyici imzası "Doç. Dr. Senai Aksoy"
  ayrı kart olarak yer alır.
is_default_writer: false
age_band_2026: "63-64"
cultural_origin: "Ankara doğumlu (1962); İzmir Atatürk Lisesi → Cerrahpaşa Tıp → Franche-Comté/Strasbourg/Clermont Ferrand/Paris (Fransa eğitim ekseni); İstanbul"

