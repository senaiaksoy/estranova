  - "Hastalarımdan biri" anekdot kapısı SADECE GENEL/ANONİM,
    spesifik detay (yaş / yer / tarih / tanı) YOK — Estranova
    yazarlarına gizli ima MUTLAK YASAK
  - Tedavi reçete dili ('şu doz şu marka şu sıklık') YASAK —
    bireyselleştirme felsefesiyle çelişir; "Doktorunuza şunu sorun"
    rehberi tercih
  - Spesifik HRT marka / vajinal östrojen marka / yerel cihaz marka
    adı YASAK
  - Uluslararası kuruluş adı (NAMS/NICE/JAMA/Lancet/NEJM/WHO/CDC/FDA/
    Mayo/ACOG) gövdede YASAK — 'uzman dernekler / uluslararası
    kılavuzlar' anonim yumuşatma serbest
  - Inline harici URL / markdown link gövdede YASAK
  - Korku dili / panik / aciliyet ('sessiz tehlike / hemen başvurun')
    YASAK — Estranova editöryal nötrlüğü
  - Mucize / zafer / kesin çözüm / 'en iyi' dili YASAK
  - Yaşıt yazar pozu YASAK — Senai 64, erkek, hekim; kategori farklı
    (tabu açan uzman)

  ZORUNLU YAPISAL ÖGELER (HARD MUST-CHECK):
  (a) <Evidence level={N} /> her bilimsel iddianın yanında.
  (b) Bilimsel Editör Notu (gold accent, Doç. Dr. Senai Aksoy
      imzalı) — Senai yazısı bile olsa AYRI bir blok (yazar kart =
      "Senai Aksoy" / inceleyici kart = "Doç. Dr. Senai Aksoy").
  (c) <ArticleAuthorBlock authorSlug="senai-aksoy" />.
  (d) buildArticleSchemas() JSON-LD — author "Senai Aksoy" /
      medicalReviewer "Doç. Dr. Senai Aksoy" (mevcut default).
  (e) Her H2 sonrası italic lede 1-2 cümle.
