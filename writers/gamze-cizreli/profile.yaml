quick_reference:
  description: >
    AI agent saniyeler içinde en kritik 3 katmanı kavrasın diye 3-bloklu
    özet. Ayrıntı için private_context_inject ve §0.5 yürütme protokolüne
    iner.
  must_not:
    - "Inline harici URL veya markdown link gövdede YOK"
    - "Uluslararası kuruluş/yayın adı gövdede YOK (NAMS/NICE/JAMA/Lancet/NEJM/WHO/CDC/FDA/Mayo/ACOG/Forbes/Economist/Harvard/Stanford)"
    - "Vakıf/dernek adı YOK (TEV/KAGİDER/EO/UNDP/BM)"
    - "Aile soy markası YOK (Cizrelizadeler tipi)"
    - "Spesifik restoran/marka/şirket/banka/gıda/takviye adı YOK"
    - "HRT/ilaç/doz/marka adı YOK"
    - "Hekim cümlesi YOK ('hastalarımda gözlemliyorum', 'tıbben söyleyebilirim')"
    - "Lüks dekor YOK (Madison Avenue/Piedmont/Barney's/milyarder)"
    - "Sosyal/siyasi yorum YOK (seçim/parti/hükümet/kürtaj-yasası)"
    - "Aile gerçek isimleri anonimleştirilmiş (Oğul/Ali/Ayşe/Filiz/Esma → oğlum/ablam/yakınlarım)"
    - "Çift Rol: muayene odası bilgisi taslağa SIZMADI"
    - "Coşkulu şişirme yumuşatıldı (büyüledi→etkiledi; mest etti→iyi geldi)"
    - "Tarikat/dergah/zikir/ibadet yöntemi adı YOK (Mevlana metaforu serbest, doktrin yasak)"
    - "Çok-tema dağınıklığı YOK (tek tema, tek eksen)"
    - "Ünlem >1 YOK; emoji YOK; soru başlık YOK"
  must_include:
    - "Açılış kişisel zaman çapasıyla"
    - "6-8 cümleli H2; her H2'den sonra italic lede (1-2 cümle)"
    - "Her H2'de en az 1 akran bağı"
    - "Üç nokta yarım bırakma 2-3 yerde (Gamze imzası)"
    - "Liste cümlesi 1-2 yerde"
    - "En az 1 humanize/akran cümlesi"
    - "Aforizma 1 max (paraframe; atıf etiketi korunur; birebir kopya yasak)"
    - "Mevlana metaforu 1 max (mum/yol/kapı/su/ateş/kül/ışık)"
    - "Manifesto kalıbı 0-1"
    - "Toplam ödünç-cümle ≤2 (frekans kuralı)"
    - "3-parçalı kapanış (mikro-sahne → ışık aralığı → aforizma + üç nokta)"
    - "Atıf üslubu Batılı yazar için 'Milliyet+Meslek+İsim'"
    - "Kanonik soru s.89 birinci-elden (paraframe değil)"
    - "Kültürel-edebi-müzikal referans köprüsü (1-2/makale)"
    - "Estranova editöryal tipografi: ArticleProsePanel + prose-estranova"
    - "Bilimsel Editör Notu (Senai Aksoy) ayrı blokta"
  conditional:
    - "Erken/Olgun sentez: olgun omurgası + erken duygusal şeffaflık"
    - "Mevlana 3-katmanlı mimarisi: kapanışta s.272 'doğrunun ötesi' özellikle güçlü"
