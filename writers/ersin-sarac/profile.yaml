  Sertifika eğitimleri: TBF Sağlık Çalışanları, Spor Travmatolojisi,
  IKOMT Musculoskeletal ve Sinir Ağrısı Terapisi.

  ESTRANOVA ÇERÇEVESİ:
  Ersin Estranova'da bilimsel yazar — Senai/Metin/Alp/Çağrı/Gonca/
  Elif/Duygu paraleli. 8. eksen: kas-iskelet rehabilitasyon + 40+
  kadın bedeni. Alp önleyici kardiyoloji / Ersin önleyici kas-iskelet
