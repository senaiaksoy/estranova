dual_role_warning:
  active: false
  description: >
    DEFAULT KAPALI. Senai (jinekolog) ile Ersin (fizyoterapist)
    arasındaki olası mesleki bağ kullanıcı doğrulamasına bağlı.
    Pelvik taban konusunda jinekoloji-fizyoterapi konsültasyonu
    olabilir; ama Ersin Senai'nin direk hastası gibi bir konum
    değil (yaş ve uzmanlık ekseni farklı). Doğrulanırsa: Senai'nin
    kadın hastalarını pelvik taban rehabilitasyonu için
    yönlendirdiği fizyoterapist olabilir; bu durumda muayene odası
    bilgisi sızmaz, iki yazar editöryal nötrlüğü kollayarak yan
    yana var olur.

