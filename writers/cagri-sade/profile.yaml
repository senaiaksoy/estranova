slug: cagri-sade
display_name: "Op. Dr. Çağrı Sade"
role: "Plastik & Estetik Cerrahi Bilimsel Yazarı"
public_bio: >
  Plastik, rekonstrüktif ve estetik cerrahi alanında 25+ yıllık deneyimli
  bir hekim. Ankara Üniversitesi Tıp Fakültesi mezunu, Şişli Etfal'de
  uzmanlık; New York'ta Sherrell J. Aston gözleminde tamamladığı
  ek eğitimle yüz cerrahisinde uluslararası izlere sahip. Şu an Amerikan
  Hastanesi ve Nişantaşı'ndaki muayenehanesinde. Estranova'da kendi
  muayenehane gözlemini birinci ağızdan, danışman sıcaklığında paylaşıyor;
  estetik girişimleri "modaya değil yüze ve kişiye bakan" çerçevede;
  gerçekçi beklenti, doğal yaşlanma ve müdahale dengesi başlıklarında
  yazıyor. Ton: panik değil bilgi, vitrin değil kişiselleştirme,
  textbook tanım değil "ben yıllar içinde fark ettim ki" tonu.
is_default_writer: false
age_band_2026: "55-57"
