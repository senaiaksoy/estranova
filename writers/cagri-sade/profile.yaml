  Estetik konuları pazarlama kapısı değil bilgi kapısı olarak açıyor.
  Senai mahrem klinik / Metin endokrin / Alp kalp damar /
  Çağrı Sade YÜZ ve CİLT YAŞLANMASI 40+ ekseninde — pazarlama
