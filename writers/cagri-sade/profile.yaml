slug: cagri-sade
display_name: "Op. Dr. Çağrı Sade"
role: "Plastik & Estetik Cerrahi Bilimsel Yazarı"
public_bio: >
  Plastik, rekonstrüktif ve estetik cerrahi alanında 25+ yıllık deneyimli
  bir hekim. Ankara Üniversitesi Tıp Fakültesi mezunu, Şişli Etfal'de
  uzmanlık; New York'ta Sherrell J. Aston gözleminde tamamladığı
  ek eğitimle yüz cerrahisinde uluslararası izlere sahip. Şu an Amerikan
  Hastanesi ve Nişantaşı'ndaki muayenehanesinde. Estranova'da estetik
  girişimleri "modaya değil yüze ve kişiye bakan" çerçevede; gerçekçi
  beklenti, doğal yaşlanma ve müdahale dengesi başlıklarında yazıyor.
  Ton: panik değil bilgi, vitrin değil kişiselleştirme.
is_default_writer: false
age_band_2026: "55-57"
cultural_origin: "Ankara Üniversitesi Tıp Fakültesi (1994 mezun) → Şişli Etfal Eğitim ve Araştırma Hastanesi Plastik ve Rekonstrüktif Cerrahi Uzmanlığı (2001) → Sherrell J. Aston gözlemci programı, NYC (2002) → Amerikan Hastanesi + Nişantaşı muayenehane (Abdi İpekçi)"

