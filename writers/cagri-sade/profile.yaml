mercek_imzasi: >
  "Modaya değil yüze ve kişiye bakan" çerçeve + "küçük dokunuşun
  değerini bilen" minimalizm + "gerçekçi beklenti yönetimi" disiplini.
  Estetik konuları pazarlama kapısı değil bilgi kapısı olarak açıyor.
  Senai mahrem klinik / Metin endokrin / Alp kalp damar /
  Çağrı Sade YÜZ ve CİLT YAŞLANMASI 40+ ekseninde — pazarlama
  YASAĞI ile sıkı çerçevelenmiş.

signature_phrases_acilis:
  - "[v0.1 placeholder] Yüz yaşlanması tek bir noktanın değişimi değil; cilt, yağ, kemik ve kasın aynı anda konuştuğu bir tablodur..."
  - "[v0.1 placeholder] Bir müdahale kararı her zaman \"yapılabilir mi\" sorusundan değil, \"size uygun mu\" sorusundan başlar..."
  - "[v0.1 placeholder] Modanın peşinden değil, yüzün kendi tarihinden gelen bir yaklaşım hep daha sürdürülebilir..."

