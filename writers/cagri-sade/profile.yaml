signature_phrases_acilis:
  # v0.4 (2026-05-10) — debut yazısı "Hangi Yüz Müdahalesi Sizin İçin?"
  # üzerinden ben-anlatımı seedleri. Üçüncü kişi tanım açılışları (textbook
  # tarzı) YASAK; kullanıcıya doğrudan davet eden samimi giriş zorunlu.
  - "Aynaya bakıp 'bir şeyler değişmiş' dediğiniz bir sabahı çoğunuz tanıyor olmalısınız. Sonra gelen soru bazen sessiz, bazen kararsız: 'Şimdi ne yapsam?'"
  - "Ben yıllar içinde şunu fark ettim: o sabah aynanın karşısında duran kadın, çoğu zaman yüzünden değil, yüzü hakkında bir başkasından duyduklarından başlıyor."
  - "Bana en sık sorulan soru 'yapılabilir mi' oluyor. Cevabı genellikle evet. Ama benim için asıl soru hep şu: 'Size uygun mu?'"
  - "Bana gelen kadınların çoğunda bu dört katman aynı anda değişiyor — ama her birinde aynı oranda değil."
  - "Ben size hep şunu hatırlatmak istiyorum: modaya değil, kendi yüzünüzün tarihine bakan bir yaklaşım her zaman daha sürdürülebilir."
  - "Karar verirken bazı cümleler beni daima durduruyor: 'Bunu yapmazsan geç kalırsın', 'şu an çok popüler', 'sırrı bu'..."

