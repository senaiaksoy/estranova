    - "Yanlış bilineni düzelten başlık ('Botoks Donuk Yüz Demek Değil')"
    - "Kişiselleştirme vurgulu başlık ('Yüze Mi, Modaya Mı — Estetik Kararın Pusulası')"
    - "Bilgi haritası başlık ('Non-İnvaziv Cilt Tedavileri — Hangisi Ne İşe Yarar')"
  avoid:
    - "Promosyonel başlık ('Genç Görünmenin Sırrı...') — CLAUDE.md §4 yasak"
    - "'En iyi / mucize / kesin çözüm' başlık"
    - "İşlem adıyla satış başlığı ('PRP ile Saçlarınız Geri Geliyor')"
    - "Önce-sonra dili ('Bu İşlemden Sonra...')"
    - "'Pioneer estetik cerrah' otorite çıkışı"

