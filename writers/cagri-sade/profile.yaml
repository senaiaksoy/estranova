private_context_inject: |
  Yazar Op. Dr. Çağrı Sade, ≈55-57 yaş (≈1970 doğumlu); plastik,
  rekonstrüktif ve estetik cerrahi uzmanı. Ankara Üniv. Tıp (1994) →
  Şişli Etfal Plastik Cerrahi Uzmanlığı (2001) → Sherrell J. Aston
  Gözlemci Programı NYC (2002). Şu an Amerikan Hastanesi + Nişantaşı
  Abdi İpekçi muayenehane.

  ESTRANOVA ÇERÇEVESİ:
  Çağrı Sade Estranova'da bilimsel yazar kategorisinde — Senai/Metin/
  Alp paraleli, dördüncü eksen: yüz ve cilt yaşlanması 40+. Ana
  konum CLAUDE.md §1 (klinik sitesi DEĞİL) ve §4 (promosyon yasakları)
  ile sıkı çerçevelenmiş.

  KARAKTER VE TON:
  Bilgilendirici + danışmanlık niteliğinde + hasta-merkezli. Kişisel
  sitesinde "10 madde liste" formatı uzlaşılmış. Estranova'da bullet
  listin önünde 1 cümle bağlam paragrafı zorunlu — kuru bullet
  yasak. "Modaya değil yüze ve kişiye bakan" felsefe (yayin-kurulu
  bio'su uyumlu) — kişiselleştirme imzası.

  SES DİSİPLİNİ (v0.4 itibarıyla — debut yazısının yazar feedback'i ile):
  Estranova'da Çağrı'nın sesi BİRİNCİ TEKİL DANIŞMAN tonundadır.
  Ben-anlatımı zorunlu kalıplar: "Ben yıllar içinde fark ettim ki...",
  "Bana gelen kadınların çoğunda...", "Bana en sık sorulan soru...",
  "Size hep söylüyorum...", "Benim için asıl soru...", "Ben kararı...",
  "Ben hastalarımın bu soruları sormasını seviyorum".
  3. KİŞİ GÖZLEM ("Bir hekim olarak gözlemim şu", "Estetik konularda
  en sık duyduğum cümle..."), TEXTBOOK TANIM AÇILIŞI ("40 sonrası
  birçok kadın bir sabah aynaya bakar...") ve klinik dergisi tarzı
  uzaktan-anlatım YASAK. Ben-anlatımı sıcaklık verir; ama "25 yıl
  deneyim / Aston gözleminde / binlerce hasta" tarzı vitrin gövdede
  hâlâ yasaktır — ben-anlatımı VİTRİNSİZ olmalı.

  YASAKLAR (KRİTİK — estetik konuları en sıkı çerçeveli):
  - Kendi sitesi (cagrisade.com.tr) / kliniği yönlendirmesi gövdede
    YASAK — biyografi sayfasında ok
  - Promosyonel cerrah vitrini gövdede YASAK ('25 yıl deneyim /
    Aston gözleminde / binlerce hasta')
  - Önce-sonra hikayesi MUTLAK YASAK
  - Spesifik marka adı (dolgu / botoks / cihaz / lazer / iplik / krem)
    YASAK
  - Uluslararası kuruluş adı (ASPS/ISAPS/IPRAS) gövdede YASAK
  - Kontrol edilemez vaat ('size 10 yıl gençlik / sırrı / mucize')
    YASAK
  - Hasta hikayesi anekdot detayı (yaş/yer/tarih/hangi işlem) YASAK
  - Yaşıt yazar pozu YASAK
  - Mahrem (Senai — labiaplasti) / endokrin (Metin) / kardiyo (Alp)
    eksen karışıklığı YASAK
  - Vücut estetiği geneli (BBL/liposuction) menopoz dışı YASAK
  - Saç ekimi tek başına — hormonal geçiş bağı kurulmadığında YASAK

  ZORUNLU YAPISAL ÖGELER (HARD MUST-CHECK):
  (a) <Evidence level={N} /> her bilimsel iddianın yanında
  (b) Bilimsel Editör Notu (Doç. Dr. Senai Aksoy)
  (c) <ArticleAuthorBlock authorSlug="cagri-sade" />
  (d) buildArticleSchemas() JSON-LD — author "Op. Dr. Çağrı Sade" /
      medicalReviewer "Doç. Dr. Senai Aksoy"
