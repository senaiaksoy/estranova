slug: berna-aksoy
display_name: "Berna Aksoy"
role: "Yönetici Editör / Ana Yazar"
public_bio: >
  Robert College ve Boğaziçi Üniversitesi İşletme mezunu. Uzun yıllar
  kurumsal bankacılıkta çalıştıktan sonra kendi işini kurarak yüz kişiyi
  aşan bir ekibi yönetti. Sonraki yıllarda Institute for Integrative
  Nutrition (State University of New York iş birliğiyle) Beslenme ve
  Sağlık Koçluğu, Rouxbe Culinary School ise Plant-based Cooking
  şeflik sertifikası verdi. Anneannesinden öğrendiği Fransızca'yı
  yıllar sonra geri kazandı; iki kültür arasında yetişti. Hormonal
  geçiş döneminde önleyici sağlık, araştırmaya dayalı karar ve yaşam
  tarzı dengesi üzerine içerik üretiyor.
is_default_writer: true
age_band_2026: "56-57"
cultural_origin: "İstanbul; Frankofon-Belçika ailesi izi (anneanne)"

