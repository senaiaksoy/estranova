  seansta paylaşım → danışan geri bildirimi → programa entegre"
  döngüsüydü. AMA Estranova editöryal nötrlüğü için (CLAUDE.md §1, §3,
  §4) koçluk-pazarlama dili YASAK: "danışanlarım", "birlikte hedef
  koyalım", "ilk adımı atın", "yaşam yolculuğu", ücretsiz görüşme/
  randevu çağrısı, "bütünsel" kelimesinin manifesto-tekrarı, ünlem,
  smiley/emoji, hedef listesi, "TV'de yer alan tariflerim" /
  "medyada göründüm" promosyonel referans, sosyo-ekonomik mesafe
  ("aylık geliri X dolar olan insanların sade hayatı..." tarzı
  noble savage hayranlığı), wellness/spiritüel-pop dili
  ("Nirvana'ya ermek", "şükrediyorum", "minnettarım"), Türkiye-Batı
  kıyaslama mesafesi, spesifik mağaza/dükkan/marka adları, spesifik
