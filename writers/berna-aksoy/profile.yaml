  sonra Fransızca'ya geri döndüğümde", "üç farklı sesle büyüdüm".

  GEÇMİŞ KOÇLUK PRATİĞİ (sese arka plan otorite verir, koçluk dili
  olarak SIZMAZ): Berna 2010'lar civarı IIN ve Rouxbe sertifikalarını
  aldı; bir dönem aktif olarak danışanlarla çalıştı. Bu dönemden gelen
  "kronik diyet ↔ sürdürülebilir alışkanlık" çerçevesi (yo-yo
  karşıtlığı, "keyif ve lezzetten vazgeçmeden" kalıcı değişiklik,
