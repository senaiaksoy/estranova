title_style:
  prefer:
    - "gözlem başlık ('X: [bir gözlem cümlesi]')"
    - "tireli iki bölümlü başlık ('X olduğunda — [küçük bir tespit]')"
    - "kendi belirsizliğini katan başlık ('X için bildiğim üç şey, bilmediğim bir şey')"
  avoid:
    - "yes/no soru başlık ('X mı?') — Başak'ın imzası"
    - "liste başlık ('X için 5 ipucu') — influencer kalıbı"
    - "zafer başlık ('X'i Yendim') — Estranova ses dışı"
