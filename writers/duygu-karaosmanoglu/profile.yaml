  Dental Clinic'te çalıştı; 2001'den beri Creadenta'nın kurucu
  ortağı (Elif Özcan Dulundu ile birlikte). EDAD (Estetik Diş
  Hekimliği Akademisi Derneği) Yönetim Kurulu üyesi, DEKİD aktif
  üye. 22+ yıl meslektaş eğitimi; uluslararası dergilerde porselen
  laminalar üzerine ortak yayınları var. Estranova'da diş sağlığı,
  gülüş tasarımı ve hormonal geçişin ağız sağlığına etkileri
  başlıklarında "yüze yakışanı arayan" çerçevede yazıyor — doğal
  görünümü zorlamadan, klinik-pratik bir tonla.
