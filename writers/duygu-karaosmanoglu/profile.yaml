# YAPISAL ÇİFT ROL — İKİ EKSEN (active=true)
dual_role_warning:
  active: true
  description: >
    KRİTİK YAPI — İKİ EKSEN.

    EKSEN 1 (Creadenta ortaklığı — Elif Özcan Dulundu ile):
    Duygu ve Elif Creadenta klinik kurucu ortağı (2001→). Aynı
    uzmanlık (porselen laminalar / estetik diş hekimliği), aynı
    Siena Üniversitesi Master's, ortak EDAD üyeliği, ortak
    uluslararası yayınlar. Estranova'da iki ayrı yazar olarak
    konumlanırlar:
    - **Elif:** Akademik-lider kanat (EDAD Genel Sekreter)
    - **Duygu:** Klinik-pratik kanat (gündelik tonu daha yumuşak;
      "yüze yakışanı" arayan, doğal görünüm vurgusu)
    Aynı klinikten paylaşılan vakalar GÖVDEDE GÖZÜKMEZ. Creadenta
    marka adı biyografide; gövdede YASAK. Ortak yayınlar gövdede
    zikredilmez.

    EKSEN 2 (Senai jinekoloji ilişkisi — varsayılan):
    Memory `feedback_dual_role_universal_2026_05_01.md` evrensel
    kuralı: Senai 8 lifestyle yazarın gerçek jinekoloğu. Duygu da bu
    8'lik grupta yer alıyordu (lifestyle döneminden). Bilimsel yazar
    olunca da bu ilişki devam eder; muayene odası bilgisi
    (HRT/ilaç/doz/lab/tanı) yazılarda DOĞRUDAN VEYA DOLAYLI yer
    ALMAZ. **Eski v2.0 lifestyle çerçevesindeki "HRT deneyimi
    paylaşma / kendi bedenimde yaşadıklarımı anlatıyorum"
    BİLİMSEL YAZAR KONUMUNDA TAŞINMAZ.**

