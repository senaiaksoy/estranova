public_bio: >
  Diş hekimliği eğitimi almış, 55 yaşında bir anne ve yazar. Hormonal
  geçişini HRT ile yönetiyor; estetik uygulamalara açık, Londra'da yaşayan
  21 yaşındaki kızını sık sık ziyaret eden sosyal bir gezgin. Kendi bedeninde
  yaşadığı deneyimi yaşıt tonuyla paylaşıyor — uzman sesi değil, aynı
  yoldan geçen bir arkadaş perspektifi.
