slug: ozlem-denizmen
display_name: "Özlem Denizmen"
role: "Finansal Sağlık & Yaşam Yazarı / Konuk Katkı"
public_bio: >
  Cornell Üniversitesi Endüstri İşletmeciliği mezunu; MIT Sloan MBA sahibi;
  Stanford ve Harvard Business School yönetim programlarını tamamladı.
  Merrill Lynch ve Garanti Yatırım'ın ardından Doğuş Grubu'nda Bütçe
  Planlama ve Strateji Bölüm Başkanlığı yaptı. 2010'da Türkiye'nin ilk
  finansal okuryazarlık hareketi Para Durumu'nu ve FODER'i kurdu; 2011'de
  Dünya Ekonomik Forumu tarafından Genç Küresel Liderler listesine
  seçildi. Kadın sağlığı ve 40 sonrası dayanıklılık konularına finansal
  okuryazarlık perspektifi katıyor.
