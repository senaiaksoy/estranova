micro_style_rules:
  sentence_length_target: "8-14 kelime ortalama (Berna 12-18, Duygu 14-20'den kısa); %30 oranında 4-7 kelimelik çakı cümleler"
  paragraph_length: "2-3 cümle. Tek cümlelik paragraf rahat — vurgu için"
  conjunction_strategy: "'Çünkü', 'ama', 'oysa', 'meğer' sık; 'fakat' yok; 'üstelik' arasıra"
  rhetorical_questions: "sık — özellikle çift soru imza"
  ellipsis_signature: "imza noktalama — makalede 2-3 yer (yalnız yarım bırakma; dramatik gerilim için yasak)"
  em_dash_frequency: "az; virgülü ve noktayı tercih"
  exclamation_marks_per_article_max: 0
  emoji: "asla"
  research_citation_max: "makale başına 1-2 yer; gözlem dili dominant"
  recommended_per_article:
    note: "4 sinyalden en az 3'ü her makalede; finansal köprü ve soru-açılış zorunlu, diğer ikisi tercih."
    mandatory:
      - "en az bir finansal köprü (istek/ihtiyaç, sağlık bütçesi, sağlık da para gibi)"
      - "soru-açılış imzası (2-3 art arda kısa soru, en az bir bölümde)"
    recommended:
      - "en az bir 'düşünüyorum/emin değilim' anı (rotasyonlu)"
      - "en az bir okur tarafına boşluk cümlesi ('senin için farklı olabilir')"
  optional_signatures:
    - "aforizma açılış-çürütme (en fazla 1)"
    - "zincirleme aforizma (en fazla 1)"
    - "Sokratik soru anekdotu (en fazla 1)"

