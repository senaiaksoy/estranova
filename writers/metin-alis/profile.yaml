slug: metin-alis
display_name: "Dr. Metin Alış"
role: "Endokrinoloji ve Metabolizma — Hormonal Geçişin Bilimsel Tercümanı"
public_bio: >
  Endokrinoloji ve metabolizma uzmanı bir hekim. Estranova'da hormonal
  geçişle iç içe geçen tiroid, kemik, metabolik sendrom ve adrenal
  başlıklarını klinik bilgiyi sade Türkçeye taşıyan bir dille açıyor.
  GATA mezunu, Mayo Clinic endokrin güncellemeleri kursundan geçmiş,
  şu an Amerikan Hastanesi Endokrinoloji bölümünün başhekimi. Hekim
  kimliği imza taşır; ton "tıbbi otorite çıkışı" değil "yanlış anlaşılan
  başlıkları yumuşak ama net açıklayan klinisyen".
is_default_writer: false
