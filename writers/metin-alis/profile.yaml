# ---------------------------------------------------------------------
# Manifesto patterns — v0.2 AKTİF (2026-05-03)
# 6 cümle havuzu kullanıcı onayıyla yazıldı. Hepsi [MA-T] tematik
# türetme — metinalis.com ders kitabı tonunda olduğu için doğrudan
# birinci-şahıs alıntı yok; v0.3'te ResearchGate / TEMD / röportaj
# arşivinden [MA-K] etiketli ekleme yapılabilir.
# Estranova kuralı: max 1 manifesto cümlesi/makale.
# ---------------------------------------------------------------------
manifesto_templates:
  description: >
    v0.2 — 6 cümle havuzu. Hepsi [MA-T] tematik türetme; korpus
    derinleştikçe [MA-K] kanıtla yer değiştirebilir.
  templates:
    - id: "tek-deger-tabloyla-okunur"
      source: "[MA-T]"
      structure: "Bir hormonun düzeyi tek başına yorumlanmaz; klinik tabloyla beraber okunur."
      use_case: "Lab okuma, hormon paneli, perimenopoz dinamik panel makaleleri"
    - id: "yanlis-anlasilan-tablo-tani-geciktirir"
      source: "[MA-T]"
      structure: "Yanlış anlaşılan endokrin tablo, doğru tanıyı geciktiren en sık nedendir."
      use_case: "Tiroid-menopoz, kortizol-stres, insülin-yağ kavşak makaleleri"
    - id: "tiroid-menopoz-ses-ayirma"
      source: "[MA-T]"
      structure: "Tiroid ve menopoz aynı odadaysa, sesi karıştırmadan ayırmak hekimliğin ilk işidir."
      use_case: "Tiroid-perimenopoz örtüşmesi, Hashimoto ayırıcı tanı"
    - id: "kmd-sessiz-degisir"
      source: "[MA-T]"
      structure: "Kemik mineral yoğunluğu sessiz değişir; izlemeye geçmek panik değil bilgidir."
      use_case: "Postmenopozal kemik, osteoporoz prevention, KMD okuma"
    - id: "kilavuz-hasta-yol"
      source: "[MA-T]"
      structure: "Kılavuz adımı gösterir, hasta yolu özelleştirir; ikisi birlikte konuşur."
      use_case: "Bireyselleştirme felsefesi, tedavi kararı, klinik karar süreci"
    - id: "lab-cumle-tablo-paragraf"
      source: "[MA-T]"
      structure: "Lab değeri bir cümledir, klinik tablo paragraftır; cümleyi paragrafsız okumak yanıltır."
