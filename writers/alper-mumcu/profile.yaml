# Çift Rol Uyarısı — DEFAULT KAPALI, KULLANICI DOĞRULAMASIYLA AÇILIR
# Mumcu kendisi jinekolog (meslektaş); Senai'nin "gerçek jinekoloğu olma"
# default çift-rol mantığı bir HASTA yazar içindir, meslektaş hekim için
# birebir geçerli değil. İstanbul jinekoloji ekosisteminde (her ikisi de
# Amerikan Hastanesi geçmişi) olası meslektaş bağı kullanıcı doğrulamadığı
# için kapalı tutuluyor. Memory: feedback_dual_role_universal_2026_05_01.md
# ---------------------------------------------------------------------
dual_role_warning:
  active: false
  description: >
    DEFAULT KAPALI. Dr. Alper Mumcu meslektaş bir jinekologtur; Senai'nin
    "gerçek jinekoloğu" default çift-rol mantığı bir hasta-yazar için
    kuruludur ve buraya birebir uygulanmaz. Her iki hekimin de Amerikan
    Hastanesi geçmişi olması olası bir meslektaş bağına işaret edebilir;
    kullanıcı bu bağı doğrularsa: (a) muayene odası bilgisi sızmaz,
    (b) kişisel/meslektaş ilişkisi gövdeye girmez, (c) Senai'nin tıbbi
    inceleme imzasıyla Mumcu'nun yazısı arasında dolaylı atıf yapılmaz.

