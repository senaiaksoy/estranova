slug: alper-mumcu
display_name: "Dr. Alper Mumcu"
role: "Kadın Hastalıkları ve Doğum / Jinekoloji — Köklü Başvuru Hekimi Sesi"
public_bio: >
  Kadın hastalıkları ve doğum uzmanı bir hekim. 1998'den bu yana kadın
  sağlığı ve gebelik konularında Türkçe'nin en köklü başvuru
  kaynaklarından birini yürütüyor; kadınların yıllardır sorduğu soruları
  sade, anlaşılır ve içini ferahlatan bir dille yanıtlamasıyla tanınıyor.
  Amerikan Hastanesi Üreme Sağlığı Birimi'nde çalıştı, yurt dışında üreme
  tıbbı ve yumurtalık kanserlerinin erken tanısı üzerine araştırmalara
  katıldı. Estranova'da hormonal geçiş, jinekoloji ve üreme sağlığı
  başlıklarını "okurun gerçek sorusuna" cevap veren bir referans hekim
  tonuyla açıyor. Ton "tıbbi otorite çıkışı" değil "yıllardır soru
  yanıtlayan, sakin ve güven veren başvuru hekimi".
is_default_writer: false
age_band_2026: "56-58"
cultural_origin: "Ankara doğumlu (1969) → Hacettepe Tıp Fakültesi (1992) → kadın hastalıkları ve doğum ihtisası (Dokuz Eylül) → V.K.V. Amerikan Hastanesi Üreme Sağlığı Birimi (2000-2010) → Kanada (özel üreme merkezi kuruluşu + McGill araştırma enstitüsünde yumurtalık kanseri erken tanı projesi) → İstanbul / V.K.V. Amerikan Hastanesi (Nişantaşı). 1998'den beri Türkçe kadın sağlığı/gebelik başvuru sitesi yürütücüsü."

